<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <text x="600" y="55" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">End-to-End CI/CD Pipeline Automation System</text>
  <text x="600" y="80" font-family="JetBrains Mono, monospace" font-size="13" fill="#38bdf8" text-anchor="middle">Git SCM ➔ Jenkins Orchestration ➔ Docker Multi-Stage ➔ Docker Hub ➔ Automated Deployment</text>

  <!-- Node 1: Developer Workstation -->
  <g transform="translate(60, 130)" filter="url(#boxShadow)">
    <rect width="180" height="200" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="90" cy="50" r="26" fill="#0284c7" opacity="0.25" />
    <text x="90" y="58" font-size="28" text-anchor="middle">💻</text>
    <text x="90" y="105" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Developer</text>
    <text x="90" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Shaik Mohamed</text>
    <line x1="20" y1="140" x2="160" y2="140" stroke="#334155" stroke-width="1" />
    <text x="90" y="162" font-family="JetBrains Mono, monospace" font-size="11" fill="#38bdf8" text-anchor="middle">git push origin main</text>
    <text x="90" y="180" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">Feature / Bugfix</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 230 L 320 230" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="320,230 310,225 310,235" fill="#38bdf8" />
  <text x="280" y="218" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Webhook</text>

  <!-- Node 2: GitHub Repository -->
  <g transform="translate(320, 130)" filter="url(#boxShadow)">
    <rect width="180" height="200" rx="12" fill="url(#blueCard)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="90" cy="50" r="26" fill="#6366f1" opacity="0.25" />
    <text x="90" y="58" font-size="28" text-anchor="middle">🐙</text>
    <text x="90" y="105" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">GitHub SCM</text>
    <text x="90" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Repository &amp; Branch</text>
    <line x1="20" y1="140" x2="160" y2="140" stroke="#334155" stroke-width="1" />
    <text x="90" y="162" font-family="JetBrains Mono, monospace" font-size="11" fill="#a5b4fc" text-anchor="middle">main branch</text>
    <text x="90" y="180" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">Pull Request Checks</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 500 230 L 580 230" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="580,230 570,225 570,235" fill="#38bdf8" />
  <text x="540" y="218" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Trigger</text>

  <!-- Node 3: Jenkins CI/CD Engine (Big Central Hub) -->
  <g transform="translate(580, 100)" filter="url(#boxShadow)">
    <rect width="280" height="260" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="280" height="42" rx="14" fill="#064e3b" />
    <text x="140" y="27" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#6ee7b7" text-anchor="middle">Jenkins Pipeline Automation</text>

    <!-- Pipeline steps inside Jenkins box -->
    <g transform="translate(18, 55)">
      <rect width="244" height="28" rx="6" fill="#1e293b" />
      <text x="12" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8fafc">1. SCM Checkout &amp; Audit</text>
      <text x="230" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981" text-anchor="end">✓</text>
    </g>
    <g transform="translate(18, 90)">
      <rect width="244" height="28" rx="6" fill="#1e293b" />
      <text x="12" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8fafc">2. Lint &amp; Syntax Analysis</text>
      <text x="230" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981" text-anchor="end">✓</text>
    </g>
    <g transform="translate(18, 125)">
      <rect width="244" height="28" rx="6" fill="#1e293b" />
      <text x="12" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8fafc">3. Jest Unit Tests (7/7)</text>
      <text x="230" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981" text-anchor="end">✓</text>
    </g>
    <g transform="translate(18, 160)">
      <rect width="244" height="28" rx="6" fill="#1e293b" />
      <text x="12" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8fafc">4. Docker Multi-Stage Build</text>
      <text x="230" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981" text-anchor="end">✓</text>
    </g>
    <g transform="translate(18, 195)">
      <rect width="244" height="28" rx="6" fill="#1e293b" />
      <text x="12" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8fafc">5. Trivy Security CVE Scan</text>
      <text x="230" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981" text-anchor="end">✓</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 (Up-right to Docker Hub) -->
  <path d="M 860 210 L 960 210" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="960,210 950,205 950,215" fill="#10b981" />
  <text x="910" y="198" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">docker push</text>

  <!-- Node 4: Docker Hub Registry -->
  <g transform="translate(960, 130)" filter="url(#boxShadow)">
    <rect width="180" height="200" rx="12" fill="url(#blueCard)" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="90" cy="50" r="26" fill="#0ea5e9" opacity="0.25" />
    <text x="90" y="58" font-size="28" text-anchor="middle">🐳</text>
    <text x="90" y="105" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Docker Hub</text>
    <text x="90" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Container Registry</text>
    <line x1="20" y1="140" x2="160" y2="140" stroke="#334155" stroke-width="1" />
    <text x="90" y="162" font-family="JetBrains Mono, monospace" font-size="11" fill="#38bdf8" text-anchor="middle">:BUILD_NUMBER</text>
    <text x="90" y="180" font-family="JetBrains Mono, monospace" font-size="11" fill="#38bdf8" text-anchor="middle">:latest</text>
  </g>

  <!-- Arrow Down from Docker Hub / Jenkins to Production Deployment -->
  <path d="M 1050 330 L 1050 480 L 870 480" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="870,480 880,475 880,485" fill="#10b981" />
  <text x="960" y="470" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981" text-anchor="middle">docker pull &amp; run</text>

  <!-- Node 5: Production Deployment Host -->
  <g transform="translate(560, 410)" filter="url(#boxShadow)">
    <rect width="300" height="210" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <rect x="0" y="0" width="300" height="38" rx="14" fill="#1e3a8a" />
    <text x="150" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#bfdbfe" text-anchor="middle">Production Deployment Environment</text>

    <g transform="translate(15, 52)">
      <rect width="270" height="36" rx="6" fill="#1e293b" />
      <text x="12" y="22" font-family="JetBrains Mono, monospace" font-size="11" fill="#38bdf8">🐳 Container: cicd-web-app-prod</text>
    </g>
    <g transform="translate(15, 96)">
      <rect width="270" height="36" rx="6" fill="#1e293b" />
      <text x="12" y="22" font-family="JetBrains Mono, monospace" font-size="11" fill="#10b981">🩺 Health Check: /health (200 OK)</text>
    </g>
    <g transform="translate(15, 140)">
      <rect width="270" height="52" rx="6" fill="#1e293b" />
      <text x="12" y="20" font-family="JetBrains Mono, monospace" font-size="11" fill="#f8fafc">🌐 Port 3000:3000</text>
      <text x="12" y="38" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">Zero-downtime rolling update + Rollback</text>
    </g>
  </g>

  <!-- Arrow Left from Deployment to Observability -->
  <path d="M 560 515 L 430 515" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="430,515 440,510 440,520" fill="#38bdf8" />
  <text x="495" y="505" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Metrics &amp; Logs</text>

  <!-- Node 6: Monitoring & Observability Dashboard -->
  <g transform="translate(120, 410)" filter="url(#boxShadow)">
    <rect width="300" height="210" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="300" height="38" rx="14" fill="#78350f" />
    <text x="150" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#fde68a" text-anchor="middle">Monitoring &amp; Observability</text>

    <g transform="translate(15, 52)">
      <text x="10" y="18" font-family="JetBrains Mono, monospace" font-size="11" fill="#e2e8f0">• Structured Morgan JSON Logs</text>
      <text x="10" y="38" font-family="JetBrains Mono, monospace" font-size="11" fill="#e2e8f0">• Continuous /health Probes</text>
      <text x="10" y="58" font-family="JetBrains Mono, monospace" font-size="11" fill="#e2e8f0">• Live Latency &amp; Memory Telemetry</text>
      <text x="10" y="78" font-family="JetBrains Mono, monospace" font-size="11" fill="#e2e8f0">• Automated Failure Rollback Alert</text>
    </g>

    <rect x="15" y="150" width="270" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="150" y="176" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">📊 Real-Time DevOps Control Panel</text>
  </g>
</svg>
