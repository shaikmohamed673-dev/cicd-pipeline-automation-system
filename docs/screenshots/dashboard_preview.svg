    <text x="40" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#a7f3d0">"version": "1.0.0", "build": { "number": "42", "commit": "a79f42c" },</text>
    <text x="40" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#a7f3d0">"system": { "hostname": "cicd-web-app-prod", "platform": "linux", "nodeVersion": "v20.18.0" },</text>
    <text x="40" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#a7f3d0">"process": { "pid": 1, "memoryRssMB": "32.40", "heapUsedMB": "14.80" }</text>
    <text x="20" y="160" font-family="JetBrains Mono, monospace" font-size="11" fill="#a7f3d0">}</text>
